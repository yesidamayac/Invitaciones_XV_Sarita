<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis 15 Años - Sarita</title>
  
  <!-- Fuentes Elegantes de Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary-color: #d4a373;
      --primary-hover: #bc8a5f;
      --bg-color: #fdf6f0;
      --card-bg: #ffffff;
      --text-color: #4a4a4a;
      --accent-color: #faedcd;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Montserrat', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      text-align: center;
      overflow-x: hidden;
    }

    /* --------------------------------------------------
       1. HERO / BANNER DE ENTRADA (CORTINA DESLIZABLE)
    -------------------------------------------------- */
    #hero-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100vh;
      background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.6)), 
                  url('https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1200&q=80') center/cover no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      z-index: 9999;
      transition: transform 0.8s ease-in-out, opacity 0.8s ease-in-out;
      cursor: pointer;
      padding: 20px;
    }

    #hero-overlay.hidden {
      transform: translateY(-100%);
      opacity: 0;
      pointer-events: none;
    }

    .hero-title { font-family: 'Great Vibes', cursive; font-size: 3.5rem; color: #faedcd; margin-bottom: 10px; }
    .hero-subtitle { font-family: 'Playfair Display', serif; font-size: 1.8rem; letter-spacing: 2px; text-transform: uppercase; }
    .hero-guest { margin-top: 20px; font-size: 1.2rem; background: rgba(255,255,255,0.2); padding: 8px 20px; border-radius: 20px; backdrop-filter: blur(5px); }
    .btn-open {
      margin-top: 30px;
      padding: 12px 30px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 1rem;
      font-weight: 600;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    /* --------------------------------------------------
       2. CONTENIDO PRINCIPAL DE LA INVITACIÓN
    -------------------------------------------------- */
    .container {
      max-width: 650px;
      margin: 0 auto;
      padding: 30px 20px 60px 20px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 35px 25px;
      margin-bottom: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      border: 1px solid #f0e6df;
    }

    h1.script-title { font-family: 'Great Vibes', cursive; font-size: 3.8rem; color: var(--primary-color); }
    h2.section-title { font-family: 'Playfair Display', serif; font-size: 1.6rem; color: #333; margin-bottom: 15px; }

    .poem {
      font-style: italic;
      color: #666;
      line-height: 1.6;
      margin: 20px 0;
      font-family: 'Playfair Display', serif;
    }

    /* Detalles del Evento */
    .event-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin: 25px 0;
    }
    .detail-item {
      background: var(--accent-color);
      padding: 15px;
      border-radius: 12px;
    }
    .detail-item h4 { font-size: 0.9rem; text-transform: uppercase; color: #8a6d4b; margin-bottom: 5px; }
    .detail-item p { font-weight: 600; color: #333; }

    /* Galería Sencilla */
    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 15px;
    }
    .gallery img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 10px;
      transition: transform 0.3s;
    }
    .gallery img:hover { transform: scale(1.03); }

    /* --------------------------------------------------
       3. SECCIÓN RSVP / FORMULARIO FINAL
    -------------------------------------------------- */
    .rsvp-card {
      background: #ffffff;
      border: 2px solid var(--primary-color);
      border-radius: 20px;
      padding: 30px 20px;
      box-shadow: 0 8px 25px rgba(212, 163, 115, 0.2);
    }

    .guest-list {
      text-align: left;
      margin: 20px 0;
      background: #fffcf7;
      padding: 15px 20px;
      border-radius: 12px;
      border: 1px solid #f2e2ce;
    }

    .checkbox-item {
      margin: 12px 0;
      font-size: 1.05rem;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .checkbox-item input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: var(--primary-color);
