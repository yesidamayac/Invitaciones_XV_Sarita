<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis 15 Años - Sarita</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Great+Vibes&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            pink: '#e65c8a',
                            lightpink: '#fdf2f8',
                            darkpink: '#be185d',
                            crimson: '#9f1239',
                            gold: '#d4af37',
                            goldlight: '#fef3c7',
                            dark: '#1e293b'
                        }
                    },
                    fontFamily: {
                        script: ['"Dancing Script"', 'cursive'],
                        cursive: ['"Great Vibes"', 'cursive'],
                        sans: ['"Montserrat"', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        /* Animaciones personalizadas */
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(3deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        
        @keyframes petalFall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }

        .animate-float {
            animation: float 4s ease-in-out infinite;
        }

        .petal {
            position: absolute;
            background: linear-gradient(135deg, #f472b6, #fb7185);
            border-radius: 150% 0 150% 0;
            opacity: 0.7;
            pointer-events: none;
            z-index: 10;
        }

        /* Glassmorphism */
        .glass-card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .glass-card-dark {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 175, 55, 0.3);
        }
    </style>
</head>
<body class="bg-gradient-to-b from-rose-50 via-white to-pink-50 text-slate-800 font-sans min-h-screen relative overflow-x-hidden">

    <!-- Lluvia de pétalos sutil de fondo -->
    <div id="petals-container" class="fixed inset-0 pointer-events-none overflow-hidden z-0"></div>

    <!-- ========================================== -->
    <!-- MODAL BANNER DE BIENVENIDA (ESTILO CARLOS Y FER) -->
    <!-- ========================================== -->
    <div id="welcome-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-md transition-opacity duration-700">
        <div class="glass-card max-w-lg w-full rounded-3xl p-8 sm:p-10 text-center shadow-2xl border-2 border-brand-gold/40 relative transform transition-transform duration-500 scale-100 animate-float">
            
            <!-- Adorno flor esquina -->
            <div class="absolute -top-6 -left-6 text-brand-pink text-4xl">
                <i class="fa-solid fa-spa"></i>
            </div>
            <div class="absolute -bottom-6 -right-6 text-brand-pink text-4xl">
                <i class="fa-solid fa-spa"></i>
            </div>

            <h3 class="font-cursive text-5xl sm:text-6xl text-brand-pink mb-2">¡Bienvenido/a!</h3>
            
            <div id="modal-guest-name" class="font-bold text-2xl sm:text-3xl text-slate-800 mb-4 tracking-wide border-b-2 border-brand-gold/30 pb-3 inline-block px-4">
                Invitado Especial
            </div>

            <p class="text-slate-600 leading
